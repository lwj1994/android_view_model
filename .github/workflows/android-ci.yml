name: Android checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Test coverage report compatibility
        run: python3 -m unittest discover -s .github/scripts/tests -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-36" "build-tools;35.0.0"
      - name: Test with coverage, build, and lint serially
        run: >-
          bash ./gradlew :android-view-model-lint:test :android-view-model:koverXmlReportDebug
          :android-view-model:koverHtmlReportDebug :android-view-model:koverVerifyDebug
          :android-view-model:assembleDebug :android-view-model:lintDebug :example:lintDebug
          --no-parallel --max-workers=1 --stacktrace
      - name: Check R8 type metadata retention
        run: bash .github/scripts/check-r8-type-metadata.sh
      - name: Verify bundled ViewModel lint in a consumer
        run: python3 .github/scripts/check-view-model-lint.py
      - name: Check host-controlled diagnostics in the release library
        run: >-
          bash ./gradlew :android-view-model:testReleaseUnitTest
          --tests milu.viewmodel.CachedLookupContractTest
          --no-parallel --max-workers=1 --stacktrace
      - name: Prepare Codecov upload report
        run: >-
          python3 .github/scripts/normalize_kover_for_codecov.py
          android-view-model/build/reports/kover/reportDebug.xml
          --output android-view-model/build/reports/kover/reportDebug-codecov.xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          # Fork pull requests use Codecov's public-repository tokenless upload.
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          files: android-view-model/build/reports/kover/reportDebug-codecov.xml
          disable_search: true
          fail_ci_if_error: true
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-check-reports
          path: |
            android-view-model/build/reports/
            android-view-model/build/test-results/
            android-view-model-lint/build/reports/
            android-view-model-lint/build/test-results/
            example/build/reports/
          if-no-files-found: ignore
